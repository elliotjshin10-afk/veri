# Netlify config lives here rather than in the dashboard so it is reviewable
# and cannot silently drift from what the repo expects.
#
# The build deliberately does NOT rebuild the site. site/index.html and
# site/index_compact.json are committed already; regenerating them needs
# address_index.json and the backtest reports, which are large derived files
# the public repo does not carry - so `make dist` succeeded locally and failed
# on every Netlify build. This copies the committed output instead.
#
# build_dist.py is stdlib-only, so there is nothing to install and the deploy
# takes seconds. The ledger, which is the one thing that changes nightly, is
# fetched by the page at run time.
[build]
  command = "python3 scripts/build_dist.py"
  publish = "dist"
  # Do not spend a build on a commit the site cannot notice. Every push to main
  # built regardless of what changed; of 24 commits in one billing cycle, 4
  # touched only scripts, tests or docs - work the published site is identical
  # before and after. That proportion grows, because most work here is pipeline
  # and model code rather than page changes.
  #
  # `ignore` runs before the build: exit 0 SKIPS, non-zero BUILDS. So the
  # default is to build, and a path not named here is treated as
  # site-affecting - the failure mode is a wasted build, never a change that
  # silently fails to ship. data/ledger is included because the nightly entries
  # are what site/ledger.json is rebuilt from.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml scripts/build_dist.py data/ledger/"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The models and the compact index are content-addressed by their build; the
# ledger must never be cached or the page shows yesterday's head.
[[headers]]
  for = "/ledger.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"
