<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#F9FAF9;color:#16191B;
  font-family:"IBM Plex Sans",sans-serif;padding:64px 72px;display:flex;
  flex-direction:column;justify-content:space-between}
.mark{font-family:Newsreader,serif;font-size:30px;letter-spacing:-.01em}
.mark b{font-weight:500}
h1{font-family:Newsreader,serif;font-weight:400;font-size:74px;line-height:1.04;
  letter-spacing:-.02em;max-width:17ch}
.stat{display:flex;align-items:baseline;gap:28px;border-top:1px solid #16191B;
  padding-top:26px}
.big{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:84px;
  letter-spacing:-.05em;line-height:1}
.cap{font-size:21px;color:#44525F;max-width:46ch;line-height:1.4}
.cap b{color:#16191B;font-weight:600}
.foot{display:flex;justify-content:space-between;align-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:16px;letter-spacing:.1em;
  text-transform:uppercase;color:#5C6B7A}
</style></head><body>
  <div class="mark">Veridis<b>.</b></div>
  <h1>Check an address before you send.</h1>
  <div class="stat"><div class="big">33%</div>
    <div class="cap">of the payments into the addresses Tether froze last half-year
      would have carried a warning from us &mdash; <b>90 days before</b> any of them
      appeared on a list.</div></div>
  <div class="foot"><span>Tron &middot; stablecoins</span>
    <span>Irreversible means irreversible</span></div>
</body></html>
